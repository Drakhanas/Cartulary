/* Template row drag-and-drop */
.nav-item-wrap{
  position:relative;
}
.nav-drag-handle{
  position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:14px;height:18px;
  display:none;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:calc(11px * var(--font-scale));
  cursor:grab;user-select:none;letter-spacing:-2px;
  line-height:1;z-index:2;
}
.nav-drag-handle:hover{color:var(--accent)}
.nav-drag-handle:active{cursor:grabbing}
.nav-item-wrap:hover .nav-drag-handle{display:flex}
.nav-item-wrap:hover .nav-item .nav-icon{visibility:hidden}
.nav-item-wrap.dragging{opacity:.4}
.nav-item-wrap.drop-before::before,
.nav-item-wrap.drop-after::after{
  content:"";position:absolute;left:6px;right:6px;height:2px;
  background:var(--accent);border-radius:1px;z-index:3;
  box-shadow:0 0 4px var(--accent);
}
.nav-item-wrap.drop-before::before{top:-1px}
.nav-item-wrap.drop-after::after{bottom:-1px}

/* image field */
.image-input-row{display:flex;gap:6px;align-items:center}
.image-input-row .input{flex:1}
.image-input-row .input:disabled{opacity:0.6;font-style:italic}
.image-hint{font-size:calc(11px * var(--font-scale));color:var(--text-dim);margin-top:4px;font-style:italic}
.image-field-zone{position:relative;padding:6px;margin:-6px;border-radius:4px;transition:background 80ms ease, box-shadow 80ms ease}
.image-field-zone.drag-over{background:var(--surf2);box-shadow:inset 0 0 0 2px var(--accent)}
.image-picker-btn,.image-clear-btn{background:var(--surf2);border:1px solid var(--border);border-radius:3px;color:var(--text);padding:5px 9px;cursor:pointer;font-size:calc(13px * var(--font-scale));line-height:1;flex:0 0 auto}
.image-picker-btn:hover,.image-clear-btn:hover{background:var(--surf3);border-color:var(--border2)}
.image-clear-btn{color:var(--text-dim)}

/* ── Template builder ── */
.tpl-builder{max-width:760px;margin:0 auto;padding:26px 30px 56px}
.section-hdr{
  font-size:calc(11px * var(--font-scale));letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-dim);margin-top:24px;margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
}
.icon-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.icon-opt{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  background:var(--surf2);border:1px solid var(--border);border-radius:3px;
  cursor:pointer;font-size:calc(15px * var(--font-scale));transition:all .1s;
}
.icon-opt:hover{background:var(--surf3);border-color:var(--border2)}
.icon-opt.sel{border-color:var(--accent);background:var(--accent-glow)}
.color-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.color-opt{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.color-opt:hover{transform:scale(1.2)}
.color-opt.sel{border-color:rgba(255,255,255,.7);transform:scale(1.15)}

.tpl-field-row{
  display:flex;flex-direction:column;gap:6px;
  padding:10px 12px;background:var(--surf2);
  border-radius:3px;margin-bottom:7px;
}
.tpl-field-line{display:flex;gap:6px;align-items:center}
.tpl-field-lbl{flex:2}
.tpl-field-type{flex:1.4;min-width:130px}
.tpl-field-flags{display:flex;gap:10px;align-items:center;font-size:calc(12px * var(--font-scale));color:var(--text-dim)}
.tpl-field-flags label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.tpl-field-flags input[type="checkbox"]{cursor:pointer;accent-color:var(--accent)}
.tpl-subfields{margin-top:6px;padding-left:10px;border-left:2px solid var(--border)}
.tpl-subfield-row{display:flex;gap:6px;align-items:center;margin-bottom:5px;padding:6px 8px;background:var(--surf3);border-radius:3px}
.tpl-subfield-wrap{display:flex;flex-direction:column;gap:5px;padding:6px 8px;background:var(--surf3);border-radius:3px;margin-bottom:5px}
.tpl-subfield-wrap .tpl-subfield-row{background:transparent;padding:0;margin-bottom:0}

/* Template preview popup (v1.3 builder UX) — toolbar sits ABOVE the centered */
/* tpl-builder container as a sibling, pinned to page-left via 24px padding   */
/* matching .hdr. preview-window-* classes apply inside the popup document.   */
.tpl-builder-toolbar{display:flex;gap:8px;align-items:center;padding:18px 24px 0}
.preview-toggle-btn{display:inline-flex;align-items:center;gap:6px}
.preview-toggle-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--text-bright)}
.preview-window{display:flex;flex-direction:column;height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif}
.preview-window-header{padding:10px 18px;background:var(--surf2);border-bottom:1px solid var(--border);font-size:calc(12px * var(--font-scale));color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
.preview-window-header strong{color:var(--text);text-transform:none;letter-spacing:normal;font-weight:600;margin-left:4px}
.preview-window-body{flex:1;padding:18px;overflow-y:auto}
.preview-window-empty{display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-dim);font-style:italic;font-size:calc(13px * var(--font-scale))}

/* v1.3: cascade-select config + ref-filters + show-when UI in template builder */
.tpl-cascade-controls{display:flex;align-items:center;gap:8px;margin-top:2px}
.tpl-cascade-pick{display:flex;align-items:center;gap:6px;font-size:calc(12px * var(--font-scale));color:var(--text-dim);flex:1}
.tpl-cascade-pick > span{flex-shrink:0}
.tpl-cascade-pick > select{flex:1;font-size:calc(12px * var(--font-scale))}
.tpl-cascade-hint{padding:8px 10px;background:var(--surf3);border-radius:3px;font-size:calc(12px * var(--font-scale));color:var(--text-dim);font-style:italic}
.tpl-cascade-matrix{display:flex;flex-direction:column;gap:5px;padding:8px 10px;background:var(--surf3);border-radius:3px;border-left:2px solid var(--accent-dim)}
.tpl-cascade-label{font-size:calc(11px * var(--font-scale));color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.tpl-cascade-row{display:flex;align-items:center;gap:8px}
.tpl-cascade-parent-val{flex:0 0 130px;font-size:calc(12px * var(--font-scale));color:var(--text);font-weight:500;text-align:right;padding-right:6px}

.tpl-ref-multi-block{display:flex;flex-direction:column;gap:6px;padding:8px 10px;background:var(--surf3);border-radius:3px;border-left:2px solid var(--accent-dim)}
.tpl-ref-multi-label{font-size:calc(11px * var(--font-scale));color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase}
.tpl-ref-clear-btn{
  padding:2px 8px;font-size:calc(11px * var(--font-scale));
  background:transparent;border:1px solid var(--border2);border-radius:3px;
  color:var(--text-dim);font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .1s;
}
.tpl-ref-clear-btn:hover{background:var(--surf2);border-color:var(--accent-dim);color:var(--text)}
.tpl-ref-multi-checks{display:flex;flex-wrap:wrap;gap:8px 14px}
.tpl-ref-multi-checks label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:calc(12px * var(--font-scale));color:var(--text)}
.tpl-ref-filter-row{display:flex;align-items:center;gap:6px;margin-top:4px;padding:6px 8px;background:var(--surf2);border-radius:3px}
.tpl-ref-filter-tplname{flex:0 0 130px;font-size:calc(12px * var(--font-scale));color:var(--text);font-weight:500}
.tpl-ref-filter-row > select{flex:1;font-size:calc(12px * var(--font-scale))}

.tpl-showwhen-row{display:flex;align-items:center;gap:6px;margin-top:2px;padding:6px 8px;background:var(--surf3);border-radius:3px;font-size:calc(12px * var(--font-scale));color:var(--text-dim)}
.tpl-showwhen-row > span{flex-shrink:0}
.tpl-showwhen-row > select{font-size:calc(12px * var(--font-scale))}
.tpl-showwhen-row > select.parent-pick{flex:0 0 160px}
.tpl-showwhen-row > .tpl-showwhen-vals{flex:1}
.tpl-showwhen-checks{display:flex;flex-wrap:wrap;gap:6px 10px}
.tpl-showwhen-checks label{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:calc(12px * var(--font-scale));color:var(--text)}

.add-field-btn{
  width:100%;padding:8px;margin-top:4px;
  background:transparent;border:1px dashed var(--border2);border-radius:3px;
  color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:calc(13px * var(--font-scale));
  cursor:pointer;text-align:center;transition:all .1s;
}
.add-field-btn:hover{background:var(--surf2);border-color:var(--accent-dim);color:var(--text)}
.add-subfield-btn{
  padding:5px 10px;margin-top:3px;font-size:calc(12px * var(--font-scale));
  background:transparent;border:1px dashed var(--border2);border-radius:3px;
  color:var(--text-dim);font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:all .1s;
}
.add-subfield-btn:hover{background:var(--surf3);border-color:var(--accent-dim);color:var(--text)}
.ipa-field{width:100%}
.ipa-field-row{display:flex;gap:6px;align-items:center}
.ipa-field-row>.input,.ipa-field-row>.form-title-input{flex:1;min-width:0}
.ipa-toggle{flex:0 0 auto;padding:5px 9px;font-size:0.72em;font-weight:700;letter-spacing:0.04em;background:var(--surf3);color:var(--text-dim);border:1px solid var(--border2);border-radius:var(--r-sm);cursor:pointer;transition:color .1s,border-color .1s}
.ipa-toggle:hover{color:var(--text);border-color:var(--accent)}
.ipa-toggle-on{background:var(--accent-glow);color:var(--text-bright);border-color:var(--accent)}
.ipa-palette{margin-top:6px;padding:8px;background:var(--surf2);border:1px solid var(--border2);border-radius:var(--r-md);max-height:240px;overflow-y:auto}
.ipa-palette-section{margin-bottom:8px}
.ipa-palette-section:last-child{margin-bottom:0}
.ipa-palette-head{font-size:0.68em;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px}
.ipa-palette-grid{display:flex;flex-wrap:wrap;gap:4px}
.ipa-chip{min-width:30px;height:30px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05em;font-family:"Charis SIL","Doulos SIL","Gentium Plus","Times New Roman",serif;line-height:1;background:var(--surf3);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:background .1s,border-color .1s}
.ipa-chip:hover{background:var(--accent-glow);color:var(--text-bright);border-color:var(--accent)}
.ipa-chip-inv{border-width:2px;border-color:var(--accent-dim)}
.ipa-chip-inv:hover{border-color:var(--accent)}
.del-field-btn{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border);border-radius:3px;
  color:var(--text-dim);cursor:pointer;font-size:calc(15px * var(--font-scale));flex-shrink:0;transition:all .1s;
}
.del-field-btn:hover:not(:disabled){background:var(--danger-bg);border-color:rgba(184,92,76,.4);color:var(--danger)}
.del-field-btn:disabled{opacity:.3;cursor:not-allowed}

/* Template field drag-and-drop */
.tpl-field-row{position:relative}
.tpl-field-row.dragging{opacity:.4}
.tpl-field-row.drop-before::before,
.tpl-field-row.drop-after::after{
  content:"";position:absolute;left:6px;right:6px;height:2px;
  background:var(--accent);border-radius:1px;z-index:3;
  box-shadow:0 0 4px var(--accent);
}
.tpl-field-row.drop-before::before{top:-3px}
.tpl-field-row.drop-after::after{bottom:-3px}
.tpl-field-drag-handle{
  display:flex;align-items:center;justify-content:center;
  width:18px;height:26px;flex-shrink:0;
  color:var(--text-dim);font-size:calc(11px * var(--font-scale));
  cursor:grab;user-select:none;letter-spacing:-2px;
  border:1px solid transparent;border-radius:3px;
  line-height:1;
}
.tpl-field-drag-handle:hover{color:var(--accent);background:var(--surf3)}
.tpl-field-drag-handle:active{cursor:grabbing}

/* ── Modal ── */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
  animation:modal-fade .14s ease-out;
}
@keyframes modal-fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surf);border:1px solid var(--border);border-radius:4px;
  max-width:520px;width:100%;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-xl);
}
.modal-wide{max-width:680px}
.modal-hdr{
  font-family:'Cormorant Garamond',serif;
  font-size:calc(21px * var(--font-scale));font-weight:500;
  color:var(--text-bright);
  padding:18px 24px 14px;border-bottom:1px solid var(--accent-dim);
  display:flex;align-items:center;
}
.modal-body{
  padding:18px 24px;overflow-y:auto;flex:1;
  font-size:calc(14px * var(--font-scale));line-height:1.6;color:var(--text);
}
.modal-actions{
  padding:14px 24px;
  display:flex;justify-content:flex-end;gap:8px;
}
.modal-section{margin-bottom:16px}
.modal-section:last-child{margin-bottom:0}
.modal-section-hdr{
  font-size:calc(11px * var(--font-scale));letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
.modal-notice{
  padding:10px 14px;border-radius:3px;
  font-size:calc(13px * var(--font-scale));margin-bottom:14px;
}
.modal-notice-warning{
  background:var(--danger-bg);border-left:3px solid var(--danger);color:var(--text);
}
.modal-notice-info{
  background:var(--accent-glow);border-left:3px solid var(--accent-dim);color:var(--text);
}
.modal-list{margin:0;padding-left:22px;list-style:disc}
.modal-list li{margin-bottom:6px}
.modal-list-warn{color:var(--danger)}
.modal-list-nested{
  margin:4px 0 0 0;padding-left:18px;list-style:circle;
  font-size:calc(12px * var(--font-scale));color:var(--text-dim);
}
.modal-list-nested li{margin-bottom:2px}
.modal-ack{
  display:flex;gap:10px;align-items:flex-start;
  margin-top:18px;padding:12px 14px;
  background:var(--surf2);border:1px solid var(--border2);border-radius:3px;
  cursor:pointer;
}
.modal-ack input[type="checkbox"]{
  margin:3px 0 0;flex-shrink:0;cursor:pointer;width:16px;height:16px;
}
.modal-ack span{font-size:calc(13px * var(--font-scale));line-height:1.5}

/* ── Settings ── */
.settings-view{max-width:680px;margin:0 auto;padding:26px 30px 56px}
.settings-section{margin-bottom:32px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-info{flex:1}
.settings-row-title{font-size:calc(15px * var(--font-scale));color:var(--text-bright);margin-bottom:3px}
.settings-row-desc{font-size:calc(13px * var(--font-scale));color:var(--text-dim);line-height:1.4}
.settings-row-action{flex-shrink:0;margin-left:16px}

/* toggle switch */
.toggle{position:relative;width:36px;height:20px;background:var(--surf3);border-radius:10px;cursor:pointer;transition:background .15s;border:1px solid var(--border2)}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--text-dim);border-radius:50%;transition:all .15s}
.toggle.on .toggle-knob{left:18px;background:var(--bg)}

.danger-zone{margin-top:32px;padding:14px;background:var(--danger-bg);border:1px solid rgba(184,92,76,.3);border-radius:3px}
.danger-zone-title{font-size:calc(12px * var(--font-scale));color:var(--danger);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

/* ── Version History (Settings sub-panel) ── */
.version-history-desc{font-size:calc(13px * var(--font-scale));color:var(--text-dim);line-height:1.5;margin-bottom:12px}
.version-history-actions{display:flex;gap:8px;margin-bottom:10px}
.snapshot-empty{padding:14px 16px;background:var(--surf2);border:1px dashed var(--border2);border-radius:3px;color:var(--text-dim);font-size:calc(13px * var(--font-scale));text-align:center;line-height:1.5}
.snapshot-list{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.snapshot-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.snapshot-row:last-child{border-bottom:none}
.snapshot-row-info{flex:1;min-width:0}
.snapshot-row-primary{display:flex;align-items:center;gap:8px;font-size:calc(14px * var(--font-scale));color:var(--text-bright);margin-bottom:2px;flex-wrap:wrap}
.snapshot-timestamp{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums}
.snapshot-pin-icon{font-size:calc(12px * var(--font-scale));line-height:1}
.snapshot-badge{font-size:calc(10px * var(--font-scale));letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:2px;font-weight:600}
.snapshot-badge--auto{background:var(--surf3);color:var(--text-dim);border:1px solid var(--border2)}
.snapshot-badge--manual{background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent-dim)}
.snapshot-row-secondary{font-size:calc(12px * var(--font-scale));color:var(--text-dim);line-height:1.4;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.snapshot-label{color:var(--text);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.snapshot-size{flex-shrink:0;font-variant-numeric:tabular-nums}
.snapshot-row-actions{display:flex;gap:5px;flex-shrink:0}
.snapshot-row-actions .btn{padding:4px 9px;font-size:calc(12px * var(--font-scale))}
.snapshot-create-label{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.snapshot-create-label-text{font-size:calc(13px * var(--font-scale));color:var(--text-dim)}

/* file upload hidden */
.hidden-file-input{display:none}

/* notice / toast */
.notice{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%, 0);
  padding:14px 24px;background:var(--surf3);border:1px solid var(--border2);border-radius:3px;
  color:var(--text);font-size:calc(15px * var(--font-scale));font-weight:500;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
  animation:slidein .2s ease;z-index:1000;
  max-width:min(640px, calc(100vw - 40px));
  text-align:center;cursor:pointer;
}
.notice.error{border-color:rgba(184,92,76,.4);color:var(--danger)}
.notice.success{border-color:var(--accent-dim);color:var(--accent)}
.notice.warning{background:#f5d76e;color:#1a1a1a;border-color:#c9a833}
@keyframes slidein{from{transform:translate(-50%, 8px);opacity:0}to{transform:translate(-50%, 0);opacity:1}}

/* loading */
.loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-size:calc(14px * var(--font-scale))}
.load-error-screen{display:flex;align-items:center;justify-content:center;height:100vh;padding:24px;overflow:auto}
.load-error-card{max-width:640px;width:100%;background:var(--surf);border:1px solid var(--border2);border-radius:6px;padding:28px 32px}
.load-error-card h1{font-family:'Cormorant Garamond',serif;font-size:calc(28px * var(--font-scale));font-weight:500;color:var(--accent);margin-bottom:14px}
.load-error-card p{margin-bottom:12px;line-height:1.55}
.load-error-card ul{margin:8px 0 18px 22px}
.load-error-card li{margin-bottom:8px;line-height:1.5}
.load-error-reason{padding:10px 12px;background:var(--danger-bg);border-left:3px solid var(--danger);font-family:'DM Sans',sans-serif;font-size:calc(14px * var(--font-scale));color:var(--text-bright)}
.load-error-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cal-locked-note{padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent-dim);color:var(--text-dim);font-size:calc(13px * var(--font-scale));line-height:1.5;border-radius:2px}

/* Backup reminder banner (top of main) */
.backup-banner{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--accent-glow);border-bottom:1px solid var(--accent-dim);flex-wrap:wrap}
.backup-banner-text{flex:1;min-width:240px;font-size:calc(13px * var(--font-scale));line-height:1.45;color:var(--text)}
.backup-banner-text strong{color:var(--accent);margin-right:6px;letter-spacing:.02em}
.backup-banner-detail{color:var(--text-dim)}
.backup-banner-actions{display:flex;gap:8px;flex-shrink:0}

/* ── Rich text editor ── */
.rich-editor{border:1px solid var(--border2);border-radius:3px;background:var(--surf2);overflow:hidden}
.rich-toolbar{display:flex;align-items:center;gap:2px;padding:5px 7px;border-bottom:1px solid var(--border);background:var(--surf3);flex-wrap:wrap}
.rt-btn{
  background:transparent;border:1px solid transparent;border-radius:3px;
  padding:4px 9px;color:var(--text-dim);cursor:pointer;
  font-family:inherit;font-size:calc(14px * var(--font-scale));min-width:28px;line-height:1.2;
  transition:all .1s;
}
.rt-btn:hover{background:var(--surf2);color:var(--text);border-color:var(--border2)}
.rt-btn.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent-dim)}
.rt-btn b{font-weight:700}
.rt-btn i{font-style:italic}
.rt-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.rich-textarea{
  width:100%;min-height:90px;padding:11px 12px;
  background:transparent;border:none;outline:none;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:calc(16px * var(--font-scale));
  line-height:1.6;resize:none;overflow:hidden;display:block;
}
.rich-preview{padding:11px 12px;min-height:90px}

/* ── Markdown content ── */
.md-content{font-size:calc(16px * var(--font-scale));line-height:1.65;color:var(--text)}
.md-content > *:first-child{margin-top:0}
.md-content > *:last-child{margin-bottom:0}
.md-content p{margin:0 0 .8em 0}
.md-content h1,.md-content h2,.md-content h3,.md-content h4{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--text-bright);margin:1em 0 .5em;line-height:1.2}
.md-content h1{font-size:calc(25px * var(--font-scale))}
.md-content h2{font-size:calc(21px * var(--font-scale))}
.md-content h3{font-size:calc(18px * var(--font-scale))}
.md-content h4{font-size:calc(16px * var(--font-scale));letter-spacing:.04em}
.md-content ul,.md-content ol{margin:0 0 .8em 1.6em;padding:0}
.md-content li{margin-bottom:.2em}
.md-content blockquote{border-left:3px solid var(--accent-dim);padding:2px 14px;color:var(--text-dim);font-style:italic;margin:.6em 0}
.md-content blockquote p{margin-bottom:.4em}
.md-content code{background:var(--surf3);padding:1px 6px;border-radius:3px;font-family:'Consolas','Courier New',monospace;font-size:.92em;color:var(--accent)}
.md-content pre{background:var(--surf3);padding:10px 12px;border-radius:3px;overflow-x:auto;margin:.6em 0;border:1px solid var(--border)}
.md-content pre code{background:transparent;padding:0;color:var(--text);font-size:.9em}
.md-content a{color:var(--accent);border-bottom:1px dotted var(--accent-dim);text-decoration:none}
.md-content a:hover{border-bottom-style:solid}
.md-content hr{border:none;border-top:1px solid var(--border);margin:1.4em 0}
.md-content strong{color:var(--text-bright);font-weight:600}
.md-content em{color:var(--text-bright)}
.md-content table{border-collapse:collapse;margin:.6em 0}
.md-content th,.md-content td{padding:6px 12px;border:1px solid var(--border)}
.md-content th{background:var(--surf3);font-weight:500;color:var(--text-bright)}

.md-content img.md-img{max-width:100%;border-radius:3px;border:1px solid var(--border);margin:.5em 0;display:block}
.md-content img.md-img-missing{padding:14px 18px;background:var(--surf3);color:var(--text-dim);font-style:italic;font-size:calc(13px * var(--font-scale));border-style:dashed}

/* Wiki links — applied both inside .md-content (markdown rendering) and
   inside text-field displays (single-line text values with [[...]] syntax). */
.wiki-link{
  display:inline-block;
  color:var(--accent);background:var(--accent-glow);
  padding:0 7px;border-radius:3px;border:1px solid var(--accent-dim);
  text-decoration:none;cursor:pointer;font-size:.96em;line-height:1.4;
  border-bottom:1px solid var(--accent-dim);
}
.wiki-link:hover{background:var(--accent);color:var(--bg);border-bottom-style:solid}
.wiki-link-broken{color:var(--danger);background:var(--danger-bg);border-color:rgba(184,92,76,.4);cursor:help}
.wiki-link-broken:hover{background:var(--danger-bg);color:var(--danger)}

/* Image folder status (settings) */
.fsaa-status{display:flex;align-items:center;gap:8px;font-size:calc(13px * var(--font-scale));color:var(--text-dim)}
.fsaa-status.connected{color:var(--accent)}
.fsaa-status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim)}
.fsaa-status.connected .fsaa-status-dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* Wiki-link autocomplete dropdown (rich editor). Rendered via portal to
   document.body and positioned with viewport coordinates so it can't be
   clipped by ancestor overflow:hidden. */
.wikilink-popup{
  position:fixed;background:var(--surf3);border:1px solid var(--border2);border-radius:3px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:100;min-width:200px;max-width:300px;
  max-height:240px;overflow-y:auto;padding:4px;
}
.wikilink-opt{
  padding:6px 10px;cursor:pointer;border-radius:2px;font-size:calc(14px * var(--font-scale));color:var(--text);
  display:flex;align-items:center;gap:8px;
}
.wikilink-opt:hover,.wikilink-opt.active{background:var(--surf2);color:var(--text-bright)}
.wikilink-opt-icon{font-size:calc(13px * var(--font-scale));opacity:.7}
.wikilink-opt-tmpl{font-size:calc(11px * var(--font-scale));color:var(--text-dim);margin-left:auto}
.wikilink-opt-history-hint{
  font-size:calc(11px * var(--font-scale));
  color:var(--text-dim);font-style:italic;margin-left:auto;
}

/* ── Graph view ── */
.graph-view{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surf)}
.graph-svg{width:100%;height:100%;display:block;cursor:grab}
.graph-svg:active{cursor:grabbing}
.graph-link{stroke:var(--border2);stroke-width:1.5;opacity:.55;transition:stroke .15s,opacity .15s}
.graph-link.highlighted{stroke:var(--accent);opacity:1;stroke-width:2}
.graph-link.faded{opacity:.12}
.graph-node-circle{stroke:var(--bg);stroke-width:2;cursor:pointer;transition:filter .15s,stroke-width .15s}
.graph-node-circle:hover{filter:brightness(1.4);stroke-width:3}
.graph-node-circle.highlighted{stroke:var(--accent);stroke-width:3}
.graph-node-circle.faded{opacity:.25}
.graph-node-label{fill:var(--text);font-size:calc(12px * var(--font-scale));font-family:'DM Sans',sans-serif;pointer-events:none;user-select:none}
.graph-node-label.faded{opacity:.25}
.graph-edge-label{fill:var(--text-dim);font-size:calc(10px * var(--font-scale));font-family:'DM Sans',sans-serif;pointer-events:none;user-select:none;letter-spacing:.05em}

.graph-controls{
  position:absolute;top:12px;left:12px;background:var(--surf2);
  border:1px solid var(--border);border-radius:3px;padding:var(--s-3) var(--s-3);
  width:260px;z-index:10;max-height:calc(100vh - 140px);overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
/* v1.3: hover info pane — read-only summary of the hovered node. Positioned
   to the right of the .graph-controls panel (12px gutter + 260px controls
   max-width + 12px gap = left:284px). pointer-events:none so the pane
   doesn't intercept mouseleave from nodes behind it (which would clear the
   hoveredId and make the pane vanish on its own approach). */
.graph-hover-pane{
  position:absolute;top:12px;left:284px;background:var(--surf2);
  border:1px solid var(--border);border-radius:3px;padding:var(--s-3) var(--s-3);
  width:300px;z-index:10;pointer-events:none;
  box-shadow:var(--shadow-lg);
}
.graph-hover-name{
  font-family:'Cormorant Garamond',serif;
  font-size:calc(18px * var(--font-scale));font-weight:600;
  color:var(--text-bright);line-height:1.2;margin-bottom:6px;
}
.graph-hover-template{
  display:flex;align-items:center;gap:6px;
  font-size:calc(11px * var(--font-scale));
  color:var(--text-dim);margin-bottom:10px;
}
.graph-hover-template-icon{font-size:calc(13px * var(--font-scale))}
.graph-hover-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.graph-hover-tag{
  font-size:calc(10px * var(--font-scale));
  padding:2px 6px;background:var(--surf3);
  border:1px solid var(--border);border-radius:2px;
  color:var(--text-dim);
}
.graph-hover-facts{
  padding-top:8px;border-top:1px solid var(--border);
  margin-bottom:8px;
}
.graph-hover-fact{margin-bottom:8px}
.graph-hover-fact:last-child{margin-bottom:0}
.graph-hover-fact-label{
  font-size:calc(10px * var(--font-scale));
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:2px;
}
.graph-hover-fact-value{
  font-size:calc(12px * var(--font-scale));
  line-height:1.4;color:var(--text);
}
.graph-hover-fact-value-secondary{
  font-size:calc(11px * var(--font-scale));
  line-height:1.4;color:var(--text-dim);
}
.graph-hover-spouse{
  font-size:calc(12px * var(--font-scale));
  line-height:1.4;color:var(--text);
  margin-bottom:2px;
}
.graph-hover-spouse:last-child{margin-bottom:0}
.graph-hover-spouse-label{color:var(--text-dim);font-style:italic}
.graph-hover-spouse-dates{color:var(--text-dim)}
.graph-hover-preview{
  padding-top:8px;border-top:1px solid var(--border);
  margin-bottom:8px;
}
.graph-hover-preview-label{
  font-size:calc(10px * var(--font-scale));
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:4px;
}
.graph-hover-preview-text{
  font-size:calc(12px * var(--font-scale));
  line-height:1.5;color:var(--text);
}
.graph-hover-meta{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:8px;border-top:1px solid var(--border);
  font-size:calc(10px * var(--font-scale));color:var(--text-dim);
}
.graph-hover-hint{font-style:italic}
.graph-controls-section{margin-bottom:10px}
.graph-controls-section:last-child{margin-bottom:0}
.graph-controls-title{font-size:calc(10px * var(--font-scale));letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.graph-filter-row{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;font-size:calc(13px * var(--font-scale));color:var(--text)}
.graph-filter-row:hover{color:var(--text-bright)}
.graph-filter-row input[type="checkbox"]{cursor:pointer;accent-color:var(--accent)}
.graph-filter-color{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.graph-filter-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.graph-filter-count{font-size:calc(11px * var(--font-scale));color:var(--text-dim)}

.graph-stats{
  position:absolute;bottom:12px;left:12px;font-size:calc(12px * var(--font-scale));color:var(--text-dim);
  background:var(--surf2);border:1px solid var(--border);border-radius:3px;
  padding:6px 10px;z-index:5;
}

.graph-empty{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--text-dim);text-align:center;font-size:calc(14px * var(--font-scale));pointer-events:none;
}
.graph-empty-glyph{font-size:calc(36px * var(--font-scale));color:var(--border2);font-family:'Cormorant Garamond',serif;margin-bottom:8px}

.graph-zoom-controls{
  position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:5;
}
.graph-zoom-btn{
  width:32px;height:32px;background:var(--surf2);border:1px solid var(--border);border-radius:3px;
  color:var(--text);font-size:calc(16px * var(--font-scale));cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.graph-zoom-btn:hover{background:var(--surf3);border-color:var(--accent-dim)}

/* ── Maps ── */
.map-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:50px 30px;color:var(--text-dim);text-align:center;gap:10px;
  background:var(--surf2);border:1px dashed var(--border2);border-radius:4px;margin-bottom:18px;
}
.map-empty-glyph{font-size:calc(32px * var(--font-scale));color:var(--border2);font-family:'Cormorant Garamond',serif}

.map-editor-toolbar{
  display:flex;align-items:center;gap:8px;padding:10px;
  background:var(--surf2);border:1px solid var(--border);border-bottom:none;
  border-radius:3px 3px 0 0;flex-wrap:wrap;
}
.map-editor-hint{font-size:calc(11px * var(--font-scale));color:var(--text-dim);font-style:italic;line-height:1.35;min-height:2.7em;display:block;flex:1 1 100%;min-width:0}

.map-canvas{
  position:relative;background:var(--surf);border:1px solid var(--border);border-radius:3px;
  overflow:hidden;cursor:crosshair;user-select:none;
  margin-bottom:18px;width:100%;
}
.map-canvas.view-mode{cursor:grab;touch-action:pan-y}
.map-image{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}

.map-resize-handle{
  position:absolute;bottom:0;right:0;
  width:18px;height:18px;
  cursor:nwse-resize;z-index:20;
  background:
    linear-gradient(135deg,
      transparent 0%, transparent 55%,
      var(--text-dim) 55%, var(--text-dim) 65%,
      transparent 65%, transparent 75%,
      var(--text-dim) 75%, var(--text-dim) 85%,
      transparent 85%);
  opacity:.4;transition:opacity .12s;
}
.map-resize-handle:hover{opacity:.95}

.map-zoom{
  position:absolute;bottom:6px;left:6px;z-index:19;
  display:flex;align-items:center;gap:3px;
  background:rgba(12,11,10,.78);padding:2px 4px;border-radius:3px;
  touch-action:auto;
}
.map-zoom .btn{padding:1px 7px;min-width:0}
.map-zoom-value{
  font-size:calc(10px * var(--font-scale));color:var(--text-dim);
  font-family:'DM Sans',sans-serif;letter-spacing:.04em;
  min-width:34px;text-align:center;
}

.map-pin{
  position:absolute;transform:translate(-50%, -100%);
  cursor:pointer;z-index:5;pointer-events:auto;
}
.map-pin.editable{cursor:move}
.map-pin-marker{
  width:22px;height:22px;background:var(--accent);
  border:2px solid var(--bg);
  border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  box-shadow:0 2px 5px rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,box-shadow .12s;
}
.map-pin:hover .map-pin-marker{
  transform:rotate(-45deg) scale(1.18);
  box-shadow:0 3px 9px rgba(0,0,0,0.6);
}
.map-pin.selected .map-pin-marker{
  transform:rotate(-45deg) scale(1.25);
  box-shadow:0 0 0 3px var(--accent), 0 3px 9px rgba(0,0,0,0.6);
}
.map-pin-marker-inner{
  transform:rotate(45deg);color:var(--bg);
  font-size:calc(10px * var(--font-scale));font-weight:600;font-family:'DM Sans',sans-serif;
}
.map-pin-label{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  background:var(--surf3);border:1px solid var(--border2);
  padding:4px 9px;border-radius:3px;
  white-space:nowrap;font-size:calc(12px * var(--font-scale));color:var(--text);
  pointer-events:none;opacity:0;transition:opacity .15s;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.map-pin:hover .map-pin-label{opacity:1}
.map-pin.selected .map-pin-label{opacity:1}
.map-pin-label-arrow{font-size:calc(10px * var(--font-scale));color:var(--text-dim);margin-left:5px}
.map-pin-label-broken{color:var(--danger)}
.map-pin-permanent-marker{
  margin-left:5px;color:var(--accent-dim);
  font-size:calc(11px * var(--font-scale));
  font-weight:600;
}

.pin-editor-panel{
  background:var(--surf2);border:1px solid var(--border);border-radius:3px;
  padding:14px;margin-bottom:18px;
}
.pin-editor-title{
  font-family:'Cormorant Garamond',serif;font-size:calc(18px * var(--font-scale));color:var(--text-bright);
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.pin-editor-coords{font-size:calc(11px * var(--font-scale));color:var(--text-dim);font-family:monospace;font-weight:400}
.pin-permanent-toggle{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-size:calc(12px * var(--font-scale));color:var(--text);
}
.pin-permanent-toggle input{margin:0;cursor:pointer}
.pin-permanent-hint{
  font-size:calc(11px * var(--font-scale));color:var(--text-dim);
  margin-top:4px;line-height:1.4;font-style:italic;
}

.map-stats{
  font-size:calc(11px * var(--font-scale));color:var(--text-dim);
  padding:8px 12px;background:var(--surf2);border-radius:3px;
  margin-bottom:14px;display:flex;gap:16px;
}
.map-stats-hidden{color:var(--accent)}

/* Map time controls (chronicles mode) */
.map-time-controls{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;background:var(--surf2);
  border-radius:3px;margin-bottom:10px;
}
.map-download-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.map-download-note{font-size:calc(12px * var(--font-scale));color:var(--text-dim)}
.map-time-slider{
  flex:1;min-width:120px;max-width:380px;height:20px;
  background:transparent;cursor:pointer;
}
.map-time-yearlabel{
  font-family:'Cormorant Garamond',serif;
  font-size:calc(15px * var(--font-scale));color:var(--text);
  min-width:60px;
}
.map-time-eras{display:flex;gap:4px;flex-wrap:wrap}
.map-pin-faded{opacity:.28;transition:opacity .15s}
.map-pin-faded:hover{opacity:.7}

/* Map drawing tools (v1.6 pillar 3) */
.map-tools{
  display:flex;flex-direction:column;gap:6px;padding:8px 10px;
  background:var(--surf2);border:1px solid var(--border);border-bottom:none;
  position:sticky;top:0;z-index:25;
}
.map-tools-row{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;min-height:32px}
.map-tools-group{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:32px}
.map-tools-group:empty{display:none}
.map-tools-group + .map-tools-group::before{content:"";width:1px;height:18px;background:var(--border);margin:0 2px}
.map-tools-group.off{opacity:.35}
.map-tools-group.off .map-swatch,.map-tools-group.off input,.map-tools-group.off button{cursor:default}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.map-stamp-filter{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.map-stamp-filter .input{flex:1;max-width:320px}
.map-stamp-count{white-space:nowrap}
.map-arrange{display:flex;gap:24px;flex-wrap:wrap}
.map-arrange-col{flex:1;min-width:240px}
.map-arrange-row{font-family:'DM Sans',sans-serif;font-size:calc(10px * var(--font-scale));letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin:10px 0 4px}
.map-arrange-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;margin-bottom:4px}
.map-arrange-item .name{flex:1}
.map-arrange-break{font-size:calc(11px * var(--font-scale));color:var(--text-dim);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.map-tools-label{
  font-family:'DM Sans',sans-serif;font-size:calc(10px * var(--font-scale));
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-left:6px;
}
.map-tools-label:first-child{margin-left:0}
.map-tools-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.map-tools-select{width:auto;padding:3px 8px;font-size:calc(11px * var(--font-scale))}
.map-swatches{display:inline-flex;align-items:center;gap:4px}
.map-swatch{
  width:18px;height:18px;border-radius:50%;padding:0;cursor:pointer;
  border:1px solid var(--border2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
.map-swatch.active{outline:2px solid var(--accent);outline-offset:1px}
.map-swatch-none{
  background:transparent;position:relative;overflow:hidden;
}
.map-swatch-none::after{
  content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;
  background:var(--danger);transform:rotate(45deg);transform-origin:center;
}
.map-canvas:focus{outline:none}
.map-canvas.draw-mode .map-image{pointer-events:auto}
.map-canvas.draw-mode .map-pin{pointer-events:none;opacity:.5}
.map-canvas.tool-select{cursor:default}
.map-canvas.tool-rect,.map-canvas.tool-ellipse,.map-canvas.tool-polygon,.map-canvas.tool-stroke,.map-canvas.tool-freehand,.map-canvas.tool-brush,.map-canvas.tool-eraser{cursor:crosshair}
.map-canvas.tool-fill{cursor:cell}
.map-canvas,.map-pin,.map-resize-handle{touch-action:none}
.map-paint-overlay{position:absolute;left:0;top:0;pointer-events:none;z-index:4;display:none}
.map-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:6}
.map-canvas.tool-select .map-overlay{pointer-events:auto}
.map-canvas.tool-select .map-overlay [data-shape]{cursor:move}
.map-canvas.tool-select .map-overlay [data-vertex]{cursor:crosshair}
.map-canvas.tool-text{cursor:text}
.map-canvas.tool-stamp{cursor:copy}
.map-canvas.tool-pan,.map-canvas.pan-ready{cursor:grab}
.map-canvas.pan-active{cursor:grabbing}
.map-canvas.tool-select .map-overlay [data-handle="nw"],.map-canvas.tool-select .map-overlay [data-handle="se"]{cursor:nwse-resize}
.map-canvas.tool-select .map-overlay [data-handle="ne"],.map-canvas.tool-select .map-overlay [data-handle="sw"]{cursor:nesw-resize}
.map-canvas.tool-select .map-overlay [data-handle="rotate"]{cursor:grab}
.map-stamp-pick{
  width:30px;height:30px;padding:3px;border-radius:3px;cursor:pointer;
  background:var(--surf);border:1px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;
}
.map-stamp-pick.active{outline:2px solid var(--accent);outline-offset:1px}
.map-tools-range{width:140px;accent-color:var(--accent)}
.map-tools-value{font-size:calc(11px * var(--font-scale));color:var(--text-dim);min-width:34px}
.map-tools-missing{font-size:calc(11px * var(--font-scale));color:var(--danger);margin-left:6px}
.map-stamps{margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:18px}
.map-stamps-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.map-stamps-title{font-family:'Cormorant Garamond',serif;font-size:calc(19px * var(--font-scale));color:var(--text-bright);margin-right:auto}
.map-stamps-empty{color:var(--text-dim);font-style:italic;font-size:calc(13px * var(--font-scale));padding:14px;border:1px dashed var(--border);border-radius:4px;background:var(--surf)}
.map-stamps-note{font-size:calc(12px * var(--font-scale));color:var(--text-dim)}
.map-stamp-group{margin-bottom:16px}
.map-stamp-group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:calc(12px * var(--font-scale));color:var(--text-dim)}
.map-stamp-group-name{color:var(--text);font-weight:500;font-size:calc(14px * var(--font-scale))}
.map-stamp-grid{display:flex;flex-wrap:wrap;gap:8px}
.map-stamp-tile{
  position:relative;width:84px;padding:8px 6px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surf);
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);cursor:default;font:inherit;
}
button.map-stamp-tile{cursor:pointer}
button.map-stamp-tile:hover{border-color:var(--accent-dim);background:var(--surf2)}
.map-stamp-tile.active{outline:2px solid var(--accent);outline-offset:1px}
.map-stamp-tile-name{font-size:calc(11px * var(--font-scale));text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.map-stamp-tile-x{
  position:absolute;top:2px;right:2px;width:18px;height:18px;line-height:16px;padding:0;border-radius:3px;
  background:transparent;border:1px solid transparent;color:var(--text-dim);cursor:pointer;font-size:13px;
}
.map-stamp-tile-x:hover{color:var(--danger);border-color:var(--border2)}
.map-tools-text{width:180px;padding:3px 8px;font-size:calc(12px * var(--font-scale))}
.map-tools-num{width:64px;padding:3px 6px;font-size:calc(12px * var(--font-scale));text-align:center}
.map-layers{
  display:flex;flex-direction:column;gap:4px;padding:8px 10px;
  background:var(--surf2);border:1px solid var(--border);border-top:1px dashed var(--border);border-bottom:none;
}
.map-layers-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.map-layers-note{font-size:calc(11px * var(--font-scale));color:var(--text-dim);font-style:italic}
.map-layer-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:3px}
.map-layer-row.active{background:var(--surf3)}
.map-layer-row.hidden-layer .map-layer-name{color:var(--text-dim);font-style:italic}
.map-layer-pick{
  width:22px;height:22px;padding:0;border:none;background:transparent;cursor:pointer;
  color:var(--text-dim);font-size:calc(14px * var(--font-scale));line-height:1;
}
.map-layer-pick.active{color:var(--accent)}
.map-layer-name{width:180px;padding:3px 8px;font-size:calc(12px * var(--font-scale))}
.map-layer-count{font-size:calc(11px * var(--font-scale));color:var(--text-dim);min-width:60px}
.map-layer-kind{font-size:calc(10px * var(--font-scale));letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--border);border-radius:3px;padding:1px 5px}

/* ── Calendar editor ── */
.cal-editor{margin-top:8px}
.cal-row{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--surf2);border:1px solid var(--border);border-radius:3px;margin-bottom:5px;position:relative}
.cal-row.dragging{opacity:.4}
.cal-row.drop-before::before,
.cal-row.drop-after::after{
  content:"";position:absolute;left:6px;right:6px;height:2px;
  background:var(--accent);border-radius:1px;z-index:3;
  box-shadow:0 0 4px var(--accent);
}
.cal-row.drop-before::before{top:-3px}
.cal-row.drop-after::after{bottom:-3px}
.cal-drag-handle{
  display:flex;align-items:center;justify-content:center;
  width:16px;height:22px;flex-shrink:0;
  color:var(--text-dim);font-size:calc(11px * var(--font-scale));
  cursor:grab;user-select:none;letter-spacing:-2px;line-height:1;
}
.cal-drag-handle:hover{color:var(--accent)}
.cal-drag-handle:active{cursor:grabbing}
.cal-row .input{padding:5px 9px;font-size:calc(13px * var(--font-scale))}
.cal-month-name{flex:2}
.cal-month-days{width:80px;flex:none}
.cal-month-days-suffix{font-size:calc(11px * var(--font-scale));color:var(--text-dim);margin-right:6px}
.cal-era-name{flex:2}
.cal-era-short{flex:0 0 90px}
.cal-era-year{flex:0 0 150px}
.cal-section-help{font-size:calc(11px * var(--font-scale));color:var(--text-dim);font-style:italic;margin-bottom:8px;line-height:1.5}

/* ── Calendar date input/display ── */
.cal-date-input{display:flex;gap:6px;align-items:center}
.cal-date-input .cal-day{flex:0 0 70px}
.cal-date-input .cal-month{flex:1}
.cal-date-input .cal-year{flex:0 0 150px}
.cal-date-input .cal-era-pick{flex:0 0 110px}
.cal-date-empty{padding:8px 11px;background:var(--surf2);border:1px dashed var(--border2);border-radius:3px;color:var(--text-dim);font-size:calc(12px * var(--font-scale));font-style:italic;text-align:center}
.cal-date-display{font-variant-numeric:tabular-nums}
.cal-date-age{color:var(--text-dim);font-style:italic;margin-left:2px}

.cal-approx-toggle{
  display:inline-flex;align-items:center;gap:3px;
  font-size:calc(13px * var(--font-scale));color:var(--text-dim);cursor:pointer;
  padding:4px 8px;border:1px solid var(--border);border-radius:3px;
}
.cal-approx-toggle input{margin:0;cursor:pointer}
.cal-approx-toggle:hover{background:var(--surf2)}

.cal-range-editor,.spouse-dates-block{display:flex;flex-direction:column;gap:10px}
.cal-range-row{display:flex;align-items:flex-start;gap:10px}
.cal-range-label{
  flex:0 0 72px;font-size:calc(11px * var(--font-scale));
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dim);
  padding-top:9px;
}
.cal-range-row > div:nth-child(2){flex:1}

.name-history-editor{display:flex;flex-direction:column;gap:8px}
.name-history-empty{
  padding:10px 12px;border:1px dashed var(--border2);border-radius:3px;
  color:var(--text-dim);font-size:calc(12px * var(--font-scale));
  font-style:italic;line-height:1.4;
}
.name-history-row{
  border:1px solid var(--border2);border-radius:3px;
  padding:10px;background:var(--surf2);
  display:flex;flex-direction:column;gap:10px;
}
.name-history-row-hdr{display:flex;gap:8px;align-items:center}
.name-history-row-dates{display:flex;gap:14px;flex-wrap:wrap}
.name-history-date-block{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.name-history-date-label{
  font-size:calc(10px * var(--font-scale));
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dim);
}
.name-history-display{margin:0;padding-left:18px;line-height:1.5}
.name-history-display-name{color:var(--text);font-weight:500}
.name-history-display-date{color:var(--text-dim);font-size:calc(12px * var(--font-scale));font-style:italic}

/* ── Timeline view ── */
.timeline-view{max-width:880px;margin:0 auto;padding:24px 30px 60px}
.timeline-controls{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:24px;background:var(--surf2);border:1px solid var(--border);border-radius:3px;flex-wrap:wrap}
.timeline-controls-label{font-size:calc(10px * var(--font-scale));letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim)}
.timeline-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 30px;color:var(--text-dim);text-align:center;gap:10px}
.timeline-empty-glyph{font-size:calc(36px * var(--font-scale));color:var(--border2);font-family:'Cormorant Garamond',serif}

.timeline-spine{position:relative;padding-left:40px}
.timeline-spine::before{
  content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg, var(--border2) 0%, var(--accent-dim) 50%, var(--border2) 100%);
}

.timeline-year-block{margin-bottom:30px;position:relative}
.timeline-year-marker{
  position:relative;font-family:'Cormorant Garamond',serif;
  font-size:calc(20px * var(--font-scale));color:var(--accent);font-weight:500;
  margin-bottom:14px;margin-left:-32px;
  display:flex;align-items:center;gap:14px;
}
.timeline-year-marker::before{
  content:"";display:block;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent-dim);
  flex-shrink:0;
}
.timeline-month-block{margin-bottom:14px}
.timeline-month-label{font-size:calc(11px * var(--font-scale));letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);margin:0 0 8px;padding-left:0}

.timeline-event{
  display:flex;gap:14px;padding:8px 12px;
  background:var(--surf);border:1px solid var(--border);border-radius:3px;
  margin-bottom:5px;cursor:pointer;transition:all .12s;
  position:relative;
}
.timeline-event::before{
  content:"";position:absolute;left:-32px;top:14px;width:18px;height:1px;
  background:var(--border2);
}
.timeline-event:hover{background:var(--surf2);border-color:var(--border2)}
.timeline-event-day{
  flex:0 0 60px;color:var(--text-dim);font-size:calc(13px * var(--font-scale));
  font-variant-numeric:tabular-nums;text-align:right;padding-top:1px;
}
.timeline-event-icon{flex:0 0 14px;text-align:center;padding-top:1px}
.timeline-event-body{flex:1;min-width:0}
.timeline-event-name{font-size:calc(14px * var(--font-scale));color:var(--text-bright);font-weight:400}
.timeline-event-meta{font-size:calc(11px * var(--font-scale));color:var(--text-dim);margin-top:1px;display:flex;gap:6px;align-items:center}
.timeline-event-tplname{color:var(--text-dim)}
.timeline-event-fieldlabel{color:var(--accent-dim);font-style:italic}
.timeline-zoom-active{background:var(--surf2);border-color:var(--border2);color:var(--text-bright)}

/* ── Chronometrics view ── */
.chrono-view{
  display:flex;flex-direction:column;height:100%;
  padding:14px 18px 0;background:var(--bg);overflow:hidden;
}
.chrono-controls{
  background:var(--surf2);border-radius:3px;
  padding:8px 12px;margin-bottom:10px;
}
.chrono-controls-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.chrono-controls-label{
  font-size:calc(10px * var(--font-scale));letter-spacing:.13em;
  text-transform:uppercase;color:var(--text-dim);
}
.chrono-filter-row{
  display:flex;align-items:center;gap:5px;cursor:pointer;
  padding:2px 8px;border:1px solid var(--border);border-radius:var(--r-pill);
  font-size:calc(13px * var(--font-scale));
}
.chrono-filter-row:hover{background:var(--surf3)}
.chrono-filter-row input{margin:0;cursor:pointer}
.chrono-filter-color{
  display:inline-block;width:10px;height:10px;border-radius:50%;
}
.chrono-link{
  color:var(--accent);font-size:calc(11px * var(--font-scale));text-decoration:none;
}
.chrono-bound-input{
  flex:0 0 100px;padding:5px 9px;font-size:calc(12px * var(--font-scale));
}
.btn-small{
  padding:4px 10px;font-size:calc(11px * var(--font-scale));
}
.chrono-svg-wrap{
  flex:1;overflow:hidden;background:var(--surf);
  border-radius:3px;
}
.chrono-svg-wrap svg{display:block}
.chrono-event:hover rect{fill-opacity:0.85}
.chrono-event:hover circle{r:7}
.chrono-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;color:var(--text-dim);text-align:center;gap:10px;padding:80px 30px;
}
.chrono-empty-glyph{
  font-size:calc(36px * var(--font-scale));color:var(--border2);
  font-family:'Cormorant Garamond',serif;
}
.chrono-hint{
  font-size:calc(11px * var(--font-scale));color:var(--text-dim);
  text-align:center;padding:6px 0 12px;font-style:italic;
}

/* Chronometric edit panel */
.chrono-event-selected circle, .chrono-event-selected rect{filter:drop-shadow(0 0 4px var(--accent))}
.chrono-edit-panel{
  background:var(--surf);
  padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px;
}
.chrono-edit-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chrono-edit-title{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.chrono-edit-entrybtn{
  background:transparent;border:none;color:var(--accent);
  font-family:'Cormorant Garamond',serif;font-size:calc(17px * var(--font-scale));
  font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:0;text-align:left;
}
.chrono-edit-entrybtn:hover{text-decoration:underline}
.chrono-edit-entryname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrono-edit-fieldlabel{
  font-size:calc(11px * var(--font-scale));color:var(--text-dim);
  letter-spacing:.04em;
}
.chrono-edit-closebtn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  width:24px;height:24px;border-radius:3px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(15px * var(--font-scale));line-height:1;flex-shrink:0;
}
.chrono-edit-closebtn:hover{background:var(--surf2);color:var(--text)}
.chrono-edit-body{display:flex;flex-direction:column;gap:8px}
.chrono-edit-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 0;
}
.chrono-edit-row-label{
  font-size:calc(11px * var(--font-scale));color:var(--text-dim);
  letter-spacing:.1em;text-transform:uppercase;min-width:48px;
}
.chrono-edit-row-empty{
  font-size:calc(13px * var(--font-scale));color:var(--text-dim);
  font-style:italic;
}
.chrono-edit-row-empty-group{
  display:flex;align-items:center;gap:8px;
}
.chrono-edit-numgroup{display:flex;align-items:stretch;gap:0}
.chrono-edit-stepbtn{
  background:var(--surf2);border:1px solid var(--border);color:var(--text);
  width:24px;font-size:calc(14px * var(--font-scale));cursor:pointer;
  padding:0;line-height:1;
}
.chrono-edit-stepbtn:hover{background:var(--surf3)}
.chrono-edit-stepbtn:first-child{border-radius:3px 0 0 3px;border-right:none}
.chrono-edit-stepbtn:last-child{border-radius:0 3px 3px 0;border-left:none}
.chrono-edit-num{
  width:72px;border-radius:0;text-align:center;
  font-size:calc(13px * var(--font-scale));padding:4px 6px;
}
.chrono-edit-month{
  width:auto;min-width:110px;font-size:calc(13px * var(--font-scale));
  padding:4px 8px;
}
.chrono-edit-approx{
  display:flex;align-items:center;gap:4px;cursor:pointer;
  font-size:calc(13px * var(--font-scale));color:var(--text-dim);
  user-select:none;
}
.chrono-edit-approx span{font-family:monospace;font-size:calc(15px * var(--font-scale))}

/* ── Family tree ── */
.family-view{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surf)}
.family-svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.family-svg:active{cursor:grabbing}

.family-controls{
  position:absolute;top:12px;left:12px;
  background:var(--surf2);border:1px solid var(--border);border-radius:3px;
  padding:var(--s-3) var(--s-3);z-index:10;min-width:240px;max-width:340px;
  box-shadow:var(--shadow-lg);
}
.family-controls-label{
  font-size:calc(10px * var(--font-scale));letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:6px;
}
.family-empty{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:var(--text-dim);max-width:460px;padding:20px;
}
.family-empty-glyph{font-size:calc(36px * var(--font-scale));color:var(--border2);margin-bottom:12px;font-family:'Cormorant Garamond',serif}
.family-empty-text{font-size:calc(14px * var(--font-scale));margin-bottom:8px;color:var(--text)}
.family-empty-hint{font-size:calc(12px * var(--font-scale));line-height:1.6}

.family-stats{
  position:absolute;bottom:12px;left:12px;font-size:calc(12px * var(--font-scale));color:var(--text-dim);
  background:var(--surf2);border:1px solid var(--border);border-radius:3px;
  padding:6px 10px;z-index:5;
  box-shadow:var(--shadow-md);
}
.family-zoom-controls{
  position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:5;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">@@CARTULARY_BABEL_BODY@@
</script>
</body>
</html>
